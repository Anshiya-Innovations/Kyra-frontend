_schema-version: 3.3.0
ID: Kyra001
version: 1.0.0
description: "Kyra SAP Cloud Application Programming Model and UI5 Application."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  # --------------------- BACKEND SERVICE ---------------------
  - name: Kyra001-srv
    type: nodejs
    path: gen/backend
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: Kyra001-db

  # --------------------- FRONTEND UI5 APP ---------------------
  - name: kyra001-ui
    type: html5
    path: app
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  # --------------------- UI DEPLOYER ---------------------
  - name: Kyra001-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: resources
      requires:
        - name: kyra001-ui
          artifacts:
            - dist.zip
          target-path: resources
    requires:
      - name: Kyra001-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true

resources:
  # --------------------- DB SERVICE ---------------------
  - name: Kyra001-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: hana
      service-plan: hdi-shared

  # --------------------- HTML5 REPO HOST ---------------------
  - name: Kyra001-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
