<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="iam2TileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052844" />
      <stop offset="100%" stop-color="#021524" />
    </linearGradient>
    <linearGradient id="userGrad2A" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="userGrad2B" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="shieldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="iamGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#008C9C" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base with Cyan Border & Glow -->
  <rect x="4" y="4" width="88" height="88" rx="24" ry="24" fill="url(#iam2TileGrad)" stroke="#00E5FF" stroke-width="2" filter="url(#iamGlow2)" />
  
  <!-- Subtle Top Rim Highlight -->
  <path d="M 20 6 Q 48 4 76 6 Q 48 16 20 6 Z" fill="rgba(56, 189, 248, 0.25)" />

  <!-- Multi-User Silhouette -->
  <!-- Secondary User (Back Right) -->
  <g transform="translate(18, 4)" opacity="0.85">
    <circle cx="43" cy="28" r="10" fill="url(#userGrad2B)" />
    <path d="M 27 57 C 27 45, 34 44, 43 44 C 52 44, 59 45, 59 57 Z" fill="url(#userGrad2B)" />
  </g>

  <!-- Primary User (Front Left) -->
  <g transform="translate(0, 4)">
    <circle cx="37" cy="30" r="12" fill="url(#userGrad2A)" />
    <path d="M 19 62 C 19 47, 27 46, 37 46 C 47 46, 55 47, 55 62 Z" fill="url(#userGrad2A)" />
  </g>

  <!-- Cyan Security Shield Badge at Lower Right -->
  <g transform="translate(52, 48)">
    <path d="M 17 2 L 31 7 C 31 20, 23 29, 17 33 C 11 29, 3 20, 3 7 Z" fill="url(#shieldGrad2)" stroke="#00E5FF" stroke-width="2" filter="url(#iamGlow2)" />
    <!-- Checkmark inside shield -->
    <path d="M 11 16 L 15.5 20.5 L 23 12.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
