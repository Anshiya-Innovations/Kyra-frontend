<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="iam1TileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072B23" />
      <stop offset="100%" stop-color="#031612" />
    </linearGradient>
    <linearGradient id="userGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <linearGradient id="shieldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="iamGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base with Emerald Border & Glow -->
  <rect x="4" y="4" width="88" height="88" rx="24" ry="24" fill="url(#iam1TileGrad)" stroke="#10B981" stroke-width="2" filter="url(#iamGlow1)" />
  
  <!-- Subtle Top Rim Highlight -->
  <path d="M 20 6 Q 48 4 76 6 Q 48 16 20 6 Z" fill="rgba(52, 211, 153, 0.25)" />

  <!-- Single User Silhouette -->
  <g transform="translate(6, 4)">
    <!-- Head -->
    <circle cx="42" cy="30" r="13" fill="url(#userGrad1)" />
    <!-- Torso -->
    <path d="M 22 62 C 22 47, 30 46, 42 46 C 54 46, 62 47, 62 62 Z" fill="url(#userGrad1)" />
  </g>

  <!-- Emerald Security Shield Badge at Lower Right -->
  <g transform="translate(52, 48)">
    <path d="M 17 2 L 31 7 C 31 20, 23 29, 17 33 C 11 29, 3 20, 3 7 Z" fill="url(#shieldGrad1)" stroke="#34D399" stroke-width="2" filter="url(#iamGlow1)" />
    <!-- Checkmark inside shield -->
    <path d="M 11 16 L 15.5 20.5 L 23 12.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
