<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="88" height="88">
  <defs>
    <linearGradient id="iam1TileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="iamShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="iamGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0084FF" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="84" height="84" rx="22" ry="22" fill="url(#iam1TileGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" filter="url(#iamGlow1)" />

  <!-- Subtle Top Highlight -->
  <path d="M 16 4 Q 44 2 72 4 Q 44 14 16 4 Z" fill="rgba(255,255,255,0.25)" />

  <!-- Single User Silhouette (White / Light-Cyan) -->
  <g transform="translate(4, 0)">
    <!-- Head -->
    <circle cx="38" cy="30" r="11" fill="#FFFFFF" opacity="0.95" />
    <!-- Shoulders / Torso -->
    <path d="M 20 56 C 20 44, 28 44, 38 44 C 48 44, 56 44, 56 56 C 56 57, 20 57, 20 56 Z" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Cyan Security Shield Badge at Lower Right -->
  <g transform="translate(48, 44)">
    <!-- Shield Outer -->
    <path d="M 15 2 L 28 6 C 28 17, 21 25, 15 29 C 9 25, 2 17, 2 6 Z" fill="url(#iamShieldGrad)" stroke="#FFFFFF" stroke-width="1.8" />
    <!-- Shield Inner Glow / Tick -->
    <path d="M 10 14 L 13.5 17.5 L 20 10.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>