<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="88" height="88">
  <defs>
    <linearGradient id="iam2TileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="iamShieldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="iamGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B5CF6" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="84" height="84" rx="22" ry="22" fill="url(#iam2TileGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" filter="url(#iamGlow2)" />

  <!-- Subtle Top Highlight -->
  <path d="M 16 4 Q 44 2 72 4 Q 44 14 16 4 Z" fill="rgba(255,255,255,0.25)" />

  <!-- Group Users Silhouettes -->
  <!-- Back/Right User (Secondary) -->
  <g transform="translate(18, -2)" opacity="0.8">
    <circle cx="36" cy="30" r="9.5" fill="#E0E7FF" />
    <path d="M 22 53 C 22 43, 28 43, 36 43 C 44 43, 50 43, 50 53 Z" fill="#E0E7FF" />
  </g>

  <!-- Front/Left User (Primary) -->
  <g transform="translate(-2, 0)">
    <circle cx="34" cy="31" r="10.5" fill="#FFFFFF" />
    <path d="M 18 56 C 18 45, 25 45, 34 45 C 43 45, 50 45, 50 56 Z" fill="#FFFFFF" />
  </g>

  <!-- Cyan Security Shield Badge at Lower Right -->
  <g transform="translate(48, 44)">
    <path d="M 15 2 L 28 6 C 28 17, 21 25, 15 29 C 9 25, 2 17, 2 6 Z" fill="url(#iamShieldGrad2)" stroke="#FFFFFF" stroke-width="1.8" />
    <path d="M 10 14 L 13.5 17.5 L 20 10.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>