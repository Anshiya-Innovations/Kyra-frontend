<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>KYRA Enterprise</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="pages/login/style.css">
    <link rel="stylesheet" type="text/css" href="pages/access/style.css">
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "kyra001": "./",
            "kyra001.pages": "./pages",
            "kyra001.pages.login": "./pages/login",
            "kyra001.pages.access": "./pages/access",
            "kyra001.pages.Approver": "./pages/Approver",
            "kyra001.pages.addAccess": "./pages/addAccess",
            "kyra001.pages.addAccessBusinessSector": "./pages/addAccessBusinessSector"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="kyra001"
        data-id="container"
        data-settings='{"id" : "kyra001"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
