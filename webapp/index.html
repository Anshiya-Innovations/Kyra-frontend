<!DOCTYPE html>
<html lang="en" spellcheck="false">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>KYRA Enterprise</title>
    <link rel="stylesheet" type="text/css" href="css/style.css?v=20261029_02">
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m, sap.f, sap.ui.layout, sap.ui.core"
        data-sap-ui-resource-roots='{
            "kyra001": "./",
            "kyra001.pages": "./pages",
            "kyra001.pages.login": "./pages/login",
            "kyra001.pages.access": "./pages/access",
            "kyra001.pages.Approver": "./pages/Approver",
            "kyra001.pages.addAccess": "./pages/addAccess",
            "kyra001.pages.addAccessBusinessSector": "./pages/addAccessBusinessSector"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
    <script src="lib/xlsx.full.min.js"></script>
    <script src="model/KyraLoader.js"></script>

    <!-- Global Spellcheck Suppressor: Prevents Red Underlines on Enterprise Inputs -->
    <script>
        (function() {
            function disableSpellcheck(root) {
                try {
                    var els = (root || document).querySelectorAll('input, textarea, .sapMInputBaseInner, .sapMTextAreaInner, [contenteditable="true"]');
                    for (var i = 0; i < els.length; i++) {
                        els[i].setAttribute('spellcheck', 'false');
                        els[i].setAttribute('autocomplete', 'off');
                        els[i].setAttribute('autocorrect', 'off');
                        els[i].setAttribute('autocapitalize', 'off');
                    }
                } catch (e) {}
            }

            document.addEventListener('focusin', function(e) {
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || (e.target.classList && e.target.classList.contains('sapMInputBaseInner')))) {
                    e.target.setAttribute('spellcheck', 'false');
                    e.target.setAttribute('autocomplete', 'off');
                    e.target.setAttribute('autocorrect', 'off');
                    e.target.setAttribute('autocapitalize', 'off');
                }
            }, true);

            if (window.MutationObserver) {
                var observer = new MutationObserver(function(mutations) {
                    for (var m = 0; m < mutations.length; m++) {
                        var added = mutations[m].addedNodes;
                        for (var n = 0; n < added.length; n++) {
                            var node = added[n];
                            if (node.nodeType === 1) {
                                if (node.tagName === 'INPUT' || node.tagName === 'TEXTAREA') {
                                    node.setAttribute('spellcheck', 'false');
                                } else if (node.querySelectorAll) {
                                    disableSpellcheck(node);
                                }
                            }
                        }
                    }
                });
                if (document.body) {
                    observer.observe(document.body, { childList: true, subtree: true });
                    disableSpellcheck(document.body);
                } else {
                    document.addEventListener('DOMContentLoaded', function() {
                        observer.observe(document.body, { childList: true, subtree: true });
                        disableSpellcheck(document.body);
                    });
                }
            }
        })();
    </script>

</head>
<body class="sapUiBody sapUiSizeCompact" id="content" spellcheck="false">
    <div
        data-sap-ui-component
        data-name="kyra001"
        data-id="container"
        data-settings='{"id" : "kyra001"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
