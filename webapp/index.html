<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>KYRA Enterprise</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
        }
        .kyraLoadingSlideOverlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background: rgba(15, 23, 42, 0.42) !important;
            backdrop-filter: blur(4px) !important;
            -webkit-backdrop-filter: blur(4px) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 999999 !important;
            opacity: 1 !important;
            pointer-events: all !important;
            transition: opacity 0.25s ease !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }
        .kyraLoadingSlideCard {
            background: #FFFFFF !important;
            width: 330px !important;
            max-width: 88vw !important;
            border-radius: 16px !important;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(226, 232, 240, 0.85) !important;
            padding: 28px 24px 24px 24px !important;
            text-align: center !important;
            box-sizing: border-box !important;
        }
        .kyraSimpleCircleSpinner {
            width: 48px !important;
            height: 48px !important;
            margin: 0 auto 16px auto !important;
            border-radius: 50% !important;
            border: 3.5px solid #E2E8F0 !important;
            border-top-color: #008C9C !important;
            border-right-color: #008C9C !important;
            animation: kyraSimpleSpin 0.85s linear infinite !important;
            box-sizing: border-box !important;
        }
        @keyframes kyraSimpleSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .kyraLoadingTitle {
            font-size: 16px !important;
            font-weight: 700 !important;
            color: #0F172A !important;
            margin: 0 0 6px 0 !important;
            line-height: 1.35 !important;
        }
        .kyraLoadingSubtitle {
            font-size: 12.5px !important;
            font-weight: 400 !important;
            color: #64748B !important;
            line-height: 1.45 !important;
            margin: 0 auto !important;
            max-width: 270px !important;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m, sap.f, sap.ui.layout, sap.ui.core"
        data-sap-ui-resource-roots='{
            "kyra001": "./",
            "kyra001.pages": "./pages",
            "kyra001.pages.login": "./pages/login",
            "kyra001.pages.access": "./pages/access",
            "kyra001.pages.Approver": "./pages/Approver",
            "kyra001.pages.addAccess": "./pages/addAccess",
            "kyra001.pages.addAccessBusinessSector": "./pages/addAccessBusinessSector"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div id="kyra_initial_loader" class="kyraLoadingSlideOverlay">
        <div class="kyraLoadingSlideCard">
            <div class="kyraSimpleCircleSpinner"></div>
            <div class="kyraLoadingTitle">Loading KYRA Enterprise...</div>
            <div class="kyraLoadingSubtitle">Initializing workspace and security entitlements...</div>
        </div>
    </div>
    <div
        data-sap-ui-component
        data-name="kyra001"
        data-id="container"
        data-settings='{"id" : "kyra001"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
