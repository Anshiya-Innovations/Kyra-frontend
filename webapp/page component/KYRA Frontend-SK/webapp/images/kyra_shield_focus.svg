<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shieldFocusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Concentric Radar / Target Rings -->
  <circle cx="50" cy="50" r="47" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3" />
  <circle cx="50" cy="50" r="39" stroke="#22D3EE" stroke-width="1.3" stroke-opacity="0.55" />
  <circle cx="50" cy="50" r="33" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.25" />

  <!-- Central Security Identity Shield -->
  <path d="M 50 21 L 70 30 V 50 C 70 65 50 76 50 76 C 50 76 30 65 30 50 V 30 L 50 21 Z" 
        stroke="#22D3EE" stroke-width="2.5" fill="#008C9C" fill-opacity="0.15" filter="url(#shieldFocusGlow)" />
  <path d="M 50 24 L 67 32 V 49 C 67 62 50 72 50 72 C 50 72 33 62 33 49 V 32 L 50 24 Z" 
        stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.5" fill="none" />

  <!-- Identity User Icon Inside Shield -->
  <circle cx="50" cy="41" r="5.5" stroke="#22D3EE" stroke-width="2" fill="none" filter="url(#shieldFocusGlow)" />
  <circle cx="50" cy="41" r="5.5" stroke="#FFFFFF" stroke-width="0.7" stroke-opacity="0.8" fill="none" />

  <path d="M 40 59 C 40 52, 45 50, 50 50 C 55 50, 60 52, 60 59" 
        stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#shieldFocusGlow)" />
  <path d="M 40 59 C 40 52, 45 50, 50 50 C 55 50, 60 52, 60 59" 
        stroke="#FFFFFF" stroke-width="0.7" stroke-opacity="0.7" stroke-linecap="round" fill="none" />
</svg>
