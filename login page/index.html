<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYRA Enterprise - Login</title>
  
  <!-- SAP UI5 Bootstrapper with Official Fiori Horizon Theme -->
  <script id="sap-ui-bootstrap"
    src="https://sdk.openui5.org/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m, sap.ui.layout, sap.ui.core"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true">
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root, html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden !important;
      font-family: 'Inter', "72", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      background-color: #F4F7FB !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    * {
      box-sizing: border-box !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    /* =========================================================================
   KYRA ENTERPRISE - FULL LIGHT ENTERPRISE THEME
   Modern, Clean, High-Contrast Light Security Theme with Teal Accents (#008C9C)
   Zero Scrollbars | Balanced Spacing | 100% Element Visibility
   ========================================================================= */

:root {
  --kyra-light-canvas: #F4F7FB;
  --kyra-light-hero-start: #FFFFFF;
  --kyra-light-hero-mid: #F1F6FA;
  --kyra-light-hero-end: #E3EEF5;
  --kyra-card-bg: #FFFFFF;
  --kyra-accent-teal: #008C9C;
  --kyra-accent-teal-dark: #006F82;
  --kyra-accent-teal-hover: #005666;
  --kyra-accent-teal-light: rgba(0, 140, 156, 0.08);
  --kyra-accent-teal-border: rgba(0, 140, 156, 0.28);
  --kyra-text-primary: #0F172A;
  --kyra-text-secondary: #475569;
  --kyra-text-muted: #64748B;
  --kyra-border-subtle: #E2E8F0;
  --kyra-border-panel: #D5E2EC;
  --kyra-input-border: #CBD5E1;
}

/* 1. SCROLLBAR REMOVAL ACROSS ALL VIEWPORTS */
.kyraDesktopLoginPage,
.kyraDesktopLoginPage *,
.kyraLoginLayoutWrapper,
.kyraLoginLayoutWrapper *,
.kyraLoginLeftPanel,
.kyraLoginLeftPanel *,
.kyraLoginRightPanel,
.kyraLoginRightPanel * {
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}

.kyraDesktopLoginPage::-webkit-scrollbar,
.kyraDesktopLoginPage *::-webkit-scrollbar,
.kyraLoginLayoutWrapper::-webkit-scrollbar,
.kyraLoginLayoutWrapper *::-webkit-scrollbar,
.kyraLoginLeftPanel::-webkit-scrollbar,
.kyraLoginLeftPanel *::-webkit-scrollbar,
.kyraLoginRightPanel::-webkit-scrollbar,
.kyraLoginRightPanel *::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}

/* 2. BASE PAGE CONTAINER */
.kyraDesktopLoginPage,
.kyraDesktopLoginPage .sapMPageEnableScrolling {
  height: 100vh !important;
  min-height: 100vh !important;
  max-height: 100vh !important;
  width: 100vw !important;
  overflow: hidden !important;
  background-color: var(--kyra-light-canvas) !important;
  font-family: 'Inter', "72", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  box-sizing: border-box !important;
}

.kyraLoginLayoutWrapper {
  width: 100% !important;
  height: 100vh !important;
  min-height: 100vh !important;
  max-height: 100vh !important;
  display: flex !important;
  flex-direction: row !important;
  flex-wrap: nowrap !important;
  overflow: hidden !important;
  box-sizing: border-box !important;
}

/* 3. LEFT SECTION (~42% WIDTH) - LIGHT ENTERPRISE SECURITY PANEL */
.kyraLoginLeftPanel {
  flex: 0 0 42% !important;
  width: 42% !important;
  min-width: 260px !important;
  height: 100vh !important;
  min-height: 100vh !important;
  max-height: 100vh !important;
  background: linear-gradient(150deg, var(--kyra-light-hero-start) 0%, var(--kyra-light-hero-mid) 50%, var(--kyra-light-hero-end) 100%) !important;
  border-right: 1px solid var(--kyra-border-panel) !important;
  position: relative !important;
  overflow: hidden !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: space-between !important;
  padding: clamp(10px, 1.8vh, 24px) clamp(16px, 2.5vw, 36px) clamp(8px, 1.4vh, 18px) clamp(16px, 2.5vw, 36px) !important;
  box-sizing: border-box !important;
  color: var(--kyra-text-primary) !important;
}

/* Subtle decorative teal radial aura */
.kyraLoginLeftPanel::before {
  content: "" !important;
  position: absolute !important;
  width: 450px !important;
  height: 450px !important;
  border-radius: 50% !important;
  background: radial-gradient(circle, rgba(0, 140, 156, 0.09) 0%, rgba(240, 246, 250, 0) 70%) !important;
  bottom: -60px !important;
  right: -60px !important;
  pointer-events: none !important;
  z-index: 0 !important;
}

/* Top-Left Branding Header */
.kyraLeftBrandHeader {
  position: relative !important;
  z-index: 2 !important;
  display: flex !important;
  align-items: center !important;
  gap: 10px !important;
  flex-shrink: 0 !important;
  margin-bottom: clamp(4px, 1vh, 10px) !important;
}

.kyraBrandLogoImgDirect {
  width: clamp(28px, 3.5vh, 38px) !important;
  height: clamp(28px, 3.5vh, 38px) !important;
  object-fit: contain !important;
  flex-shrink: 0 !important;
  filter: drop-shadow(0 2px 5px rgba(0, 140, 156, 0.25)) !important;
}

.kyraBrandLogoText {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(15px, 1.8vh, 19px) !important;
  font-weight: 800 !important;
  letter-spacing: 1.6px !important;
  color: var(--kyra-text-primary) !important;
  line-height: 1.1 !important;
}

.kyraBrandLogoSub {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(8px, 0.95vh, 9.5px) !important;
  font-weight: 700 !important;
  letter-spacing: 1.8px !important;
  color: var(--kyra-accent-teal) !important;
  text-transform: uppercase !important;
  line-height: 1.2 !important;
}

/* Vertically Centered Main Block */
.kyraLeftCenteredBlock {
  position: relative !important;
  z-index: 2 !important;
  flex: 1 1 auto !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  margin: auto 0 !important;
  padding: 0 !important;
  max-width: 480px !important;
}

.kyraHeroTitleContainer {
  display: flex !important;
  flex-direction: column !important;
  margin-bottom: clamp(2px, 0.6vh, 8px) !important;
}

.kyraHeroTitleDark,
.kyraHeroTitleWhite {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(17px, 2.2vh, 28px) !important;
  font-weight: 800 !important;
  color: var(--kyra-text-primary) !important;
  line-height: 1.15 !important;
  letter-spacing: -0.4px !important;
}

.kyraHeroTitleTeal {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(17px, 2.2vh, 28px) !important;
  font-weight: 800 !important;
  color: var(--kyra-accent-teal) !important;
  line-height: 1.15 !important;
  letter-spacing: -0.4px !important;
}

.kyraHeroDescription {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(10.5px, 1.2vh, 12.5px) !important;
  line-height: 1.4 !important;
  color: var(--kyra-text-secondary) !important;
  margin-bottom: clamp(4px, 0.8vh, 10px) !important;
  max-width: 420px !important;
  display: -webkit-box !important;
  -webkit-line-clamp: 3 !important;
  -webkit-box-orient: vertical !important;
  overflow: hidden !important;
}

/* Center Security Shield Graphic */
.kyraHeroShieldGraphicWrapper {
  position: relative !important;
  margin: clamp(2px, 0.5vh, 6px) auto clamp(2px, 0.6vh, 8px) auto !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
}

.kyra-futuristic-shield-container {
  position: relative !important;
  width: clamp(62px, 8vh, 90px) !important;
  height: clamp(62px, 8vh, 90px) !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}

.kyra-shield-outer-glow {
  position: absolute !important;
  width: 80% !important;
  height: 80% !important;
  border-radius: 50% !important;
  background: radial-gradient(circle, rgba(0, 140, 156, 0.22) 0%, rgba(240, 246, 250, 0) 70%) !important;
  filter: blur(5px) !important;
}

.kyra-shield-orbital-ring {
  position: absolute !important;
  border-radius: 50% !important;
  border: 1px dashed rgba(0, 140, 156, 0.35) !important;
  pointer-events: none !important;
}

.kyra-shield-orbital-ring.ring-1 {
  width: 92% !important;
  height: 92% !important;
}

.kyra-shield-orbital-ring.ring-2 {
  width: 110% !important;
  height: 110% !important;
  border-style: dotted !important;
  opacity: 0.6 !important;
}

.kyra-shield-core {
  position: relative !important;
  z-index: 2 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  filter: drop-shadow(0 4px 12px rgba(0, 140, 156, 0.35)) !important;
}

.kyra-shield-core svg {
  width: clamp(52px, 6.8vh, 80px) !important;
  height: clamp(58px, 7.5vh, 88px) !important;
}

/* "Enterprise Grade Security" Pill Badge */
.kyraEnterpriseGradeBadge {
  margin-top: clamp(2px, 0.4vh, 6px) !important;
  padding: clamp(2px, 0.3vh, 3px) clamp(8px, 1vw, 12px) !important;
  background: var(--kyra-accent-teal-light) !important;
  border: 1px solid var(--kyra-accent-teal-border) !important;
  border-radius: 20px !important;
  display: inline-flex !important;
  align-items: center !important;
  gap: 5px !important;
}

.kyraBadgeIcon {
  font-size: clamp(10px, 1.2vh, 11.5px) !important;
  color: var(--kyra-accent-teal-dark) !important;
}

.kyraBadgeText {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(9px, 1.1vh, 10.5px) !important;
  font-weight: 600 !important;
  color: var(--kyra-accent-teal-dark) !important;
  letter-spacing: 0.2px !important;
}

/* Bottom 3 Feature Highlights */
.kyraLeftIndicatorsContainer {
  position: relative !important;
  z-index: 2 !important;
  display: flex !important;
  justify-content: space-between !important;
  align-items: center !important;
  width: 100% !important;
  padding-top: clamp(6px, 1vh, 12px) !important;
  border-top: 1px solid var(--kyra-border-panel) !important;
  margin-top: auto !important;
  flex-shrink: 0 !important;
}

.kyraIndicatorItem {
  display: flex !important;
  align-items: center !important;
  gap: clamp(4px, 0.6vw, 6px) !important;
}

.kyraIndicatorCircleIcon {
  width: clamp(22px, 2.6vh, 28px) !important;
  height: clamp(22px, 2.6vh, 28px) !important;
  border-radius: 50% !important;
  border: 1px solid var(--kyra-accent-teal) !important;
  color: var(--kyra-accent-teal-dark) !important;
  background: var(--kyra-accent-teal-light) !important;
  font-size: clamp(10px, 1.3vh, 12.5px) !important;
  line-height: clamp(22px, 2.6vh, 28px) !important;
  text-align: center !important;
  flex-shrink: 0 !important;
}

.kyraIndicatorTextTop {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(8px, 0.95vh, 9px) !important;
  font-weight: 500 !important;
  color: var(--kyra-text-muted) !important;
  line-height: 1.15 !important;
}

.kyraIndicatorTextBottom {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(9.5px, 1.1vh, 10.5px) !important;
  font-weight: 700 !important;
  color: var(--kyra-text-primary) !important;
  line-height: 1.15 !important;
}

/* 4. RIGHT SECTION (~58% WIDTH) - SOFT LIGHT CANVAS & WHITE LOGIN CARD */
.kyraLoginRightPanel {
  flex: 1 1 58% !important;
  width: 58% !important;
  min-width: 300px !important;
  height: 100vh !important;
  min-height: 100vh !important;
  max-height: 100vh !important;
  background-color: var(--kyra-light-canvas) !important;
  background-image: radial-gradient(#CBD5E1 1px, transparent 1px) !important;
  background-size: 24px 24px !important;
  background-position: right top !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: clamp(8px, 1.5vh, 24px) clamp(10px, 1.8vw, 24px) !important;
  box-sizing: border-box !important;
  overflow: hidden !important;
}

/* Centered White Login Card */
.kyraLoginCardContainer {
  background: var(--kyra-card-bg) !important;
  border-radius: clamp(12px, 1.8vh, 18px) !important;
  border: 1px solid var(--kyra-border-subtle) !important;
  box-shadow: 0 16px 40px rgba(15, 23, 42, 0.07), 0 2px 6px rgba(15, 23, 42, 0.03) !important;
  width: 100% !important;
  max-width: 395px !important;
  padding: clamp(12px, 2vh, 24px) clamp(16px, 2vw, 28px) !important;
  box-sizing: border-box !important;
  margin: auto !important;
  position: relative !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
}

/* Top Card Header */
.kyraCardHeaderBox {
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  text-align: center !important;
  margin-bottom: clamp(6px, 1.2vh, 14px) !important;
}

.kyraCardLogoImgDirect {
  width: clamp(30px, 4vh, 42px) !important;
  height: clamp(30px, 4vh, 42px) !important;
  object-fit: contain !important;
  margin-bottom: clamp(3px, 0.6vh, 6px) !important;
  filter: drop-shadow(0 2px 6px rgba(0, 140, 156, 0.25)) !important;
}

.kyraCardBrandTitle {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(17px, 2.2vh, 22px) !important;
  font-weight: 800 !important;
  color: var(--kyra-text-primary) !important;
  letter-spacing: -0.3px !important;
  line-height: 1.15 !important;
  margin-bottom: 2px !important;
}

.kyraCardBrandSub {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(11px, 1.2vh, 12.5px) !important;
  font-weight: 600 !important;
  color: var(--kyra-accent-teal) !important;
  letter-spacing: 0.2px !important;
  margin-bottom: 2px !important;
}

.kyraCardWelcomeText {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(10.5px, 1.1vh, 12px) !important;
  color: var(--kyra-text-muted) !important;
  font-weight: 400 !important;
}

/* Form Controls */
.kyraLoginFormBody {
  width: 100% !important;
}

.kyraFormGroup {
  margin-bottom: clamp(6px, 1vh, 12px) !important;
}

.kyraFormLabel {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(11px, 1.2vh, 12px) !important;
  font-weight: 600 !important;
  color: #334155 !important;
  margin-bottom: clamp(2px, 0.4vh, 4px) !important;
  display: block !important;
}

/* Modern Select Dropdown */
.kyraModernSelect {
  width: 100% !important;
}

.kyraModernSelect .sapMSlt {
  height: clamp(36px, 4.4vh, 44px) !important;
  border-radius: 7px !important;
  border: 1px solid var(--kyra-input-border) !important;
  background-color: #FFFFFF !important;
  transition: all 0.2s ease !important;
  padding: 0 10px !important;
}

.kyraModernSelect:hover .sapMSlt {
  border-color: #94A3B8 !important;
}

.kyraModernSelect.sapMSltFocused .sapMSlt,
.kyraModernSelect .sapMSlt:focus {
  border-color: var(--kyra-accent-teal) !important;
  box-shadow: 0 0 0 3px rgba(0, 140, 156, 0.18) !important;
}

.kyraModernSelect .sapMSltLabel {
  line-height: clamp(34px, 4.2vh, 42px) !important;
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(12px, 1.3vh, 13px) !important;
  color: var(--kyra-text-primary) !important;
  font-weight: 500 !important;
}

.kyraModernSelect .sapMSltArrow {
  line-height: clamp(34px, 4.2vh, 42px) !important;
  color: var(--kyra-text-muted) !important;
}

/* Modern Input Field */
.kyraModernInput {
  width: 100% !important;
}

.kyraModernInput .sapMInputBaseInner {
  height: clamp(36px, 4.4vh, 44px) !important;
  border-radius: 7px !important;
  border: 1px solid var(--kyra-input-border) !important;
  background-color: #FFFFFF !important;
  padding: 0 12px !important;
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(12px, 1.3vh, 13px) !important;
  color: var(--kyra-text-primary) !important;
  transition: all 0.2s ease !important;
}

.kyraModernInput .sapMInputBaseInner::placeholder {
  color: #94A3B8 !important;
  font-weight: 400 !important;
}

.kyraModernInput .sapMInputBaseInner:hover {
  border-color: #94A3B8 !important;
}

.kyraModernInput.sapMInputBaseFocused .sapMInputBaseInner,
.kyraModernInput .sapMInputBaseInner:focus {
  border-color: var(--kyra-accent-teal) !important;
  box-shadow: 0 0 0 3px rgba(0, 140, 156, 0.18) !important;
}

/* Remember Me & Need Help Row */
.kyraRememberRow {
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  margin-top: 1px !important;
  margin-bottom: clamp(6px, 1vh, 12px) !important;
  padding: 0 2px !important;
}

.kyraModernCheckBox .sapMCbLabel {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(11px, 1.2vh, 12px) !important;
  color: #475569 !important;
  font-weight: 500 !important;
}

.kyraModernCheckBox .sapMCbBg {
  border-radius: 4px !important;
  border-color: var(--kyra-input-border) !important;
  width: 16px !important;
  height: 16px !important;
}

.kyraModernCheckBox.sapMCbMarkChecked .sapMCbBg {
  background-color: var(--kyra-accent-teal-dark) !important;
  border-color: var(--kyra-accent-teal-dark) !important;
}

.kyraHelpLink {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(11px, 1.2vh, 12px) !important;
  font-weight: 600 !important;
  color: var(--kyra-accent-teal) !important;
  text-decoration: none !important;
}

.kyraHelpLink:hover {
  color: var(--kyra-accent-teal-dark) !important;
  text-decoration: underline !important;
}

/* Solid Deep Teal Sign In Button */
.kyraPrimarySignInBtn {
  margin-bottom: clamp(6px, 1vh, 10px) !important;
  width: 100% !important;
}

.kyraPrimarySignInBtn .sapMBtnInner {
  height: clamp(38px, 4.6vh, 44px) !important;
  background: var(--kyra-accent-teal-dark) !important;
  border: none !important;
  border-radius: 7px !important;
  box-shadow: 0 4px 12px rgba(0, 111, 130, 0.25) !important;
  transition: all 0.2s ease !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}

.kyraPrimarySignInBtn:hover .sapMBtnInner {
  background: var(--kyra-accent-teal-hover) !important;
  box-shadow: 0 5px 15px rgba(0, 111, 130, 0.35) !important;
  transform: translateY(-1px) !important;
}

.kyraPrimarySignInBtn .sapMBtnContent {
  color: #FFFFFF !important;
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(12.5px, 1.4vh, 13.5px) !important;
  font-weight: 600 !important;
  letter-spacing: 0.3px !important;
}

.kyraPrimarySignInBtn .sapMBtnIcon {
  color: #FFFFFF !important;
  font-size: 13px !important;
}

/* Bottom Security Note */
.kyraSecurityFooterNote {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 5px !important;
  margin-top: 2px !important;
  padding: 0 0 2px 0 !important;
}

.kyraLockIconSmall {
  font-size: 12px !important;
  color: var(--kyra-accent-teal) !important;
}

.kyraSecurityNoteText {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(9.5px, 1.05vh, 10.5px) !important;
  font-weight: 500 !important;
  color: var(--kyra-text-muted) !important;
  text-align: center !important;
}

/* 5. ULTRA-COMPACT VIEWPORT HEIGHT FIX (<= 520px) */
@media (max-height: 520px) {
  .kyraLoginLeftPanel {
    padding: 8px 16px 6px 16px !important;
  }
  .kyraHeroDescription {
    display: none !important;
  }
  .kyra-futuristic-shield-container {
    transform: scale(0.72) !important;
    margin: -8px 0 !important;
  }
  .kyraLoginRightPanel {
    padding: 6px 12px !important;
  }
  .kyraLoginCardContainer {
    padding: 10px 16px 8px 16px !important;
  }
  .kyraCardHeaderBox {
    margin-bottom: 4px !important;
  }
  .kyraFormGroup {
    margin-bottom: 4px !important;
  }
  .kyraRememberRow {
    margin-bottom: 4px !important;
  }
  .kyraPrimarySignInBtn {
    margin-bottom: 4px !important;
  }
}

/* 6. MOBILE STACKED VIEWPORT (< 640px WIDTH) */
@media (max-width: 639px) {
  .kyraDesktopLoginPage,
  .kyraDesktopLoginPage .sapMPageEnableScrolling,
  .kyraLoginLayoutWrapper {
    height: auto !important;
    min-height: 100vh !important;
    max-height: none !important;
    overflow-y: auto !important;
  }

  .kyraLoginLayoutWrapper {
    flex-direction: column !important;
  }

  .kyraLoginLeftPanel {
    flex: 0 0 auto !important;
    width: 100% !important;
    height: auto !important;
    min-height: auto !important;
    max-height: none !important;
    padding: 14px 16px !important;
    text-align: center !important;
    align-items: center !important;
    border-right: none !important;

                            <Title text="KYRA Enterprise" level="H2" class="kyraCardBrandTitle" />
                            <Text text="Secure Admin Access Portal" class="kyraCardBrandSub" />
                            <Text text="Welcome back! Please sign in to continue." class="kyraCardWelcomeText" />
                        </VBox>

                        <!-- Error Notification MessageStrip -->
                        <MessageStrip
                            visible="{login>/hasError}"
                            text="{login>/errorMessage}"
                            type="Error"
                            showIcon="true"
                            showCloseButton="true"
                            close=".onDismissError"
                            class="sapUiSmallMarginBottom" />

                        <!-- Form Controls Container -->
                        <VBox width="100%" class="kyraLoginFormBody">
                            
                            <!-- Login As Dropdown -->
                            <VBox class="kyraFormGroup" width="100%">
                                <Label text="Login As" labelFor="roleSelect" class="kyraFormLabel" />
                                <Select
                                    id="roleSelect"
                                    selectedKey="{login>/selectedRole}"
                                    change=".onRoleChange"
                                    width="100%"
                                    class="kyraModernSelect">
                                    <items>
                                        <core:Item key="Requester" text="Requester" icon="sap-icon://customer" />
                                        <core:Item key="Approver" text="Approver" icon="sap-icon://shield" />
                                        <core:Item key="Compliance Review" text="Compliance Review" icon="sap-icon://user-settings" />
                                    </items>
                                </Select>
                            </VBox>

                            <!-- Dynamic ID Input Field (Clean, No Inner Button Glitches) -->
                            <VBox class="kyraFormGroup" width="100%">
                                <Label text="{login>/idLabel}" labelFor="idInput" class="kyraFormLabel" />
                                <Input
                                    id="idInput"
                                    value="{login>/userId}"
                                    placeholder="{login>/idPlaceholder}"
                                    valueState="{login>/idState}"
                                    valueStateText="{login>/idStateText}"
                                    liveChange=".onInputChange"
                                    change=".onInputChange"
                                    submit=".onLogin"
                                    class="kyraModernInput"
                                    width="100%" />
                            </VBox>

                            <!-- Remember Me Row -->
                            <FlexBox justifyContent="SpaceBetween" alignItems="Center" width="100%" class="kyraRememberRow">
                                <CheckBox text="Remember Me" selected="{login>/rememberMe}" class="kyraModernCheckBox" />
                                <Link text="Need Help?" press=".onForgotPassword" class="kyraHelpLink" />
                            </FlexBox>

                            <!-- Full Width Solid Deep Teal Sign In Button -->
                            <Button
                                id="signInButton"
                                text="Sign In"
                                icon="sap-icon://navigation-right-arrow"
                                iconFirst="false"
                                type="Emphasized"
                                width="100%"
                                press=".onLogin"
                                busy="{login>/isBusy}"
                                class="kyraPrimarySignInBtn" />

                            <!-- Bottom Security Verification Note -->
                            <HBox justifyContent="Center" alignItems="Center" class="kyraSecurityFooterNote">
                                <core:Icon src="sap-icon://shield" class="kyraLockIconSmall" />
                                <Text text="Protected by 256-Bit SSL Enterprise Identity Security" class="kyraSecurityNoteText" />
                            </HBox>
                        </VBox>
                    </VBox>
                </VBox>

            </FlexBox>

    sap.ui.getCore().attachInit(function () {
      sap.ui.define("kyra.login.new.Controller", [
        "sap/ui/core/mvc/Controller",
        "sap/ui/model/json/JSONModel",
        "sap/m/MessageToast",
        "sap/m/Dialog",
        "sap/m/Button",
        "sap/m/Label",
        "sap/m/Input",
        "sap/m/VBox",
        "sap/m/Text"
      ], function (Controller, JSONModel, MessageToast, Dialog, Button, Label, Input, VBox, Text) {
        "use strict";

        return Controller.extend("kyra.login.new.Controller", {
          onInit: function () {
            var oModel = new JSONModel({
              selectedRole: "Requester",
              userId: "",
              rememberMe: true,
              isBusy: false,
              hasError: false,
              errorMessage: "",
              idLabel: "Requester ID",
              idPlaceholder: "Enter your Requester ID",
              idState: "None",
              idStateText: ""
            });

            this.getView().setModel(oModel, "login");
          },

          onRoleChange: function (oEvent) {
            var sSelectedRole = oEvent.getParameter("selectedItem").getKey();
            var oModel = this.getView().getModel("login");

            var sLabel = "Requester ID";
            var sPlaceholder = "Enter your Requester ID";

            if (sSelectedRole === "Approver") {
              sLabel = "Approver ID";
              sPlaceholder = "Enter your Approver ID";
            } else if (sSelectedRole === "Compliance Review" || sSelectedRole === "Compliance Approver") {
              sLabel = "Compliance Review ID";
              sPlaceholder = "Enter your Compliance Review ID";
            } else if (sSelectedRole === "Administrator") {
              sLabel = "Administrator ID";
              sPlaceholder = "Enter your Administrator ID";
            }

            oModel.setProperty("/selectedRole", sSelectedRole);
            oModel.setProperty("/idLabel", sLabel);
            oModel.setProperty("/idPlaceholder", sPlaceholder);

            this._resetErrorStates();
          },

          _resetErrorStates: function () {
            var oModel = this.getView().getModel("login");
            oModel.setProperty("/idState", "None");
            oModel.setProperty("/idStateText", "");
            oModel.setProperty("/hasError", false);
            oModel.setProperty("/errorMessage", "");
          },

          onInputChange: function () {
            var oModel = this.getView().getModel("login");
            var sUserId = oModel.getProperty("/userId");

            if (sUserId && sUserId.trim().length > 0) {
              oModel.setProperty("/idState", "None");
              oModel.setProperty("/idStateText", "");
            }

            if (sUserId && oModel.getProperty("/hasError")) {
              oModel.setProperty("/hasError", false);
              oModel.setProperty("/errorMessage", "");
            }
          },

          onDismissError: function () {
            var oModel = this.getView().getModel("login");
            oModel.setProperty("/hasError", false);
            oModel.setProperty("/errorMessage", "");
          },

          onLogin: function () {
            var oView = this.getView();
            var oModel = oView.getModel("login");

            var sEffectiveTitle = oModel.getProperty("/selectedRole") || "Requester";
            var sUserId = (oView.byId("idInput").getValue() || "").trim();
            oModel.setProperty("/userId", sUserId);
            var bRemember = oModel.getProperty("/rememberMe");

            this._resetErrorStates();

            if (!sUserId) {
              var sErr = "Please enter your Requester ID.";
              if (sEffectiveTitle === "Approver") {
                sErr = "Please enter your Approver ID.";
              } else if (sEffectiveTitle === "Compliance Review" || sEffectiveTitle === "Compliance Approver") {
                sErr = "Please enter your Compliance Review ID.";
              } else if (sEffectiveTitle === "Administrator") {
                sErr = "Please enter your Administrator ID.";
              }
              oModel.setProperty("/idState", "Error");
              oModel.setProperty("/idStateText", sErr);
              return;
            }

            oModel.setProperty("/isBusy", true);

            if (bRemember) {
              localStorage.setItem("kyra_remember_role", sEffectiveTitle);
              localStorage.setItem("kyra_remember_id", sUserId);
            } else {
              localStorage.removeItem("kyra_remember_role");
              localStorage.removeItem("kyra_remember_id");
            }

            sessionStorage.setItem("kyra_active_user", sUserId);
            sessionStorage.setItem("kyra_active_role", sEffectiveTitle);

            setTimeout(function () {
              oModel.setProperty("/isBusy", false);
              MessageToast.show("Login successful! Welcome to KYRA Enterprise, " + sUserId, { duration: 3000 });

              setTimeout(function () {
                if (window.location.href.includes("login page")) {
                  window.location.href = "../index.html";
                } else if (window.opener || window.parent !== window) {
                  window.location.href = "../../index.html";
                } else {
                  window.location.href = "../../index.html";
                }
              }, 800);
            }, 500);
          },

          onForgotPassword: function () {
            var oView = this.getView();
            var oLoginModel = oView.getModel("login");
            var sEffectiveTitle = oLoginModel.getProperty("/selectedRole") || "Requester";
            var sCurrentId = oLoginModel.getProperty("/userId") || "";

            var oInput = new Input({
              placeholder: "Enter ID or Email",
              value: sCurrentId,
              width: "100%"
            });

            var oDialog = new Dialog({
              title: "Reset Password",
              type: "Message",
              contentWidth: "360px",
              content: [
                new VBox({
                  class: "sapUiSmallMargin",
                  items: [
                    new Text({
                      text: "Enter your registered ID or email to receive password reset instructions.",
                      class: "sapUiSmallMarginBottom"
                    }),
                    new Label({
                      text: sEffectiveTitle + " ID / Email",
                      required: true,
                      labelFor: oInput
                    }),
                    oInput
                  ]
                })
              ],
              beginButton: new Button({
                text: "Send Reset Link",
                type: "Emphasized",
                press: function () {
                  var sVal = oInput.getValue().trim();
                  if (!sVal) {
                    oInput.setValueState("Error");
                    oInput.setValueStateText("ID or Email is required.");
                    return;
                  }
                  oInput.setValueState("None");
                  oDialog.close();
                  MessageToast.show("Password reset link sent to your registered contact!", { duration: 4000 });
                }
              }),
              endButton: new Button({
                text: "Cancel",
                press: function () {
                  oDialog.close();
                }
              })
            });

            oDialog.open();
          }
        });
      });

      sap.ui.core.mvc.XMLView.create({
        definition: sLoginViewXml
      }).then(function (oView) {
        oView.placeAt("content");
      });
    });
  </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
